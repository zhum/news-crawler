spider:
  # Note: trv-science.ru may require a browser user agent:
  # user_agent: "Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:147.0) Gecko/20100101 Firefox/147.0"
  user_agent: "newsfetcher (HPC enthusiast)"
  download_delay: 1
  concurrent_requests_per_domain: 1
  robotstxt_obey: true

logging:
  log_file: "newsfetcher.log"
  log_level: "INFO"

ai:
  # GGUF model file path (resolved relative to ai-summary.py), not an Ollama name.
  model: "../GGUF/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf"
  temperature: 0.01
  max_lines: 300

tags:
  hardware: " News about CPUs, GPUs, HPC accelerators, storage, interconnects, HPC hardware announcements"
  software: "HPC Tools, libraries, compilers, runtimes, frameworks"
  benchmarks: "Performance results, rankings, comparisons"
  new_technology: "Emerging technologies, research breakthroughs"
  investments: "Funding rounds, acquisitions, partnerships, business deals"
  market: "HPC Market trends, adoption, industry analysis"
  opensource: "Open source projects, licenses, community"
  software_update: "New versions, patches, releases"
  supercomputing: "Top500, HPC center installations, national labs, HPC schedulers"
  AI: "Machine learning, LLMs, neural networks, inference"
  speculations: "Opinions, predictions, rumors, editorials"
  science: "Scientific research, discoveries, publications"
  other: "Other topics"

groups:
  - name: HPC News
    topic: "High Performance Computing: new technologies, new and updated HPC software, benchmark results; lower interest for routine hardware installations"
    tags: [hardware, software, benchmarks, new_technology, investments, market, opensource, software_update, supercomputing, AI, speculations, other]
    output:
      added_file: "added.txt"
      summary_file: "summary.json"
    sites:
      - name: "semianalysis"
        url: "https://newsletter.semianalysis.com/archive"
        css: ".pc-display-flex"
        link: "a::attr(href)"
        headercss: "h1.post-title::text"
        articlecss: "div.available-content"
      - name: "hpcwire scienve"
        url: "https://www.hpcwire.com/sector/science-technology/"
        css: ".article-content"
        link: "h3 a::attr(href)"
        headercss: ".card-head::text"
        articlecss: "div.gsp_dc"
      - name: "hpcwire manufacturing"
        url: "https://www.hpcwire.com/sector/manufacturing/"
        css: ".article-content"
        link: "h3 a::attr(href)"
        headercss: ".card-head::text"
        articlecss: "div.gsp_dc"
      - name: "hpcwire academia"
        url: "https://www.hpcwire.com/sector/academia-research/"
        css: ".article-content"
        link: "h3 a::attr(href)"
        headercss: ".card-head::text"
        articlecss: "div.gsp_dc"
      - name: "insidehpc"
        url: "https://insidehpc.com/category/news-analysis/"
        css: "div.post"
        link: "a.entry-title-link::attr(href)"
        headercss: "h1.entry-title::text"
        articlecss: "div.post"
      - name: "eetimes"
        url: "https://www.eetimes.com/category/news-analysis/"
        css: "div.card-body"
        link: "a.article-links::attr(href)"
        headercss: ".articleHeader-title::text"
        articlecss: ".articleBody"
      - name: "the register"
        url: https://www.theregister.com/on_prem/hpc/
        css: .headlines
        link: a.story_link::attr(href)
        headercss: h1::text
        articlecss: div#body
      - name: llnl
        url: https://hpc.llnl.gov/about-livermore-computing/hpc-news
        css: .views-field.views-field-title
        link: h2.field-content.field-news>a::attr(href)
        headercss: h1.page-header::text
        articlecss: div#onelab-content
      - name: slurm blog
        url: https://www.schedmd.com/blog/
        css: .post-content-wrap
        link: a.entire-meta-link::attr(href)
        headercss: "h1.entry-title::text"
        articlecss: .container.main-content
      - name: slurm releases
        url: https://www.schedmd.com/category/release-announcements/feed/
        css: rss
        link: link
        headercss: "h1::text"
        articlecss: .post-area
      - name: NVIDIA news
        url: https://nvidianews.nvidia.com/news/
        css: .main_wrap.white_wrap
        link: .index-item-text-link>a::attr(href)
        headercss: h1.article-title::text
        articlecss: .article-body
      - name: NVIDIA blog
        url: https://blogs.nvidia.com/blog/author/nvidianewsroom/
        css: .article-excerpt
        link: a.read-more::attr(href)
        headercss: h1::text
        articlecss: .entry-content
      - name: HPSF
        url: https://hpsf.io/blog/
        css: .list-design.outer
        link: .list-design.title>a::attr(href)
        headercss: h1.entry-title::text
        articlecss: .main-content>.row
      - name: IEEE Spectrum
        url: https://spectrum.ieee.org/feeds/type/news.rss
        css: rss
        link: link
        headercss: span.widget__headline-text::text
        articlecss: .body-description
      - name: Science news
        url: https://www.sciencenews.org/topic/computing/feed
        css: rss
        link: link
        headercss: h1::text
        articlecss: .rich-text--with-sidebar
      - name: Opencompute
        url: https://www.opencompute.org/blog
        css: article
        link: a.link--gray-darker::attr(href)
        headercss: h2.news-article__title::text
        articlecss: section.news-article__body
      - name: Networkworld
        url: https://www.networkworld.com/news/
        css: .content-listing-various__container
        link: a.content-row-article::attr(href)
        headercss: h1.article-hero__title::text
        articlecss: .article-column__content
      - name: GlennKlockwood
        url: https://glennklockwood.com/garden/index.xml
        css: rss
        link: link
        headercss: h1.article-title::text
        articlecss: article.popover-hint
      - name: GlennKlockwood-blog
        url: https://blog.glennklockwood.com/feeds/posts/default?alt=rss
        css: rss
        link: link
        headercss: h3.post-title::text
        articlecss: .post-body-container
      - name: AWS HPC blog
        url: https://aws.amazon.com/blogs/hpc/feed
        css: rss
        link: link
        headercss: "h1::text"
        articlecss: "article.blog-post"
      - name: Azure HPC blog
        url: https://techcommunity.microsoft.com/tag/hpc?nodeId=board%3AAzureHighPerformanceComputingBlog
        css: "h4 a"
        link: "a::attr(href)"
        headercss: "h1::text"
        articlecss: "article"
      - name: TOP500 news
        url: https://top500.org/news/feed
        css: rss
        link: link
        headercss: "h1::text"
        articlecss: "article"
      - name: ServeTheHome
        url: https://servethehome.com/feed
        css: rss
        link: link
        headercss: "h1::text"
        articlecss: "td-post-content"
      - name: AMD ROCm HPC blog
        url: https://rocm.blogs.amd.com/verticals-hpc.html
        css: ".sd-card"
        link: "a.reference::attr(href)"
        headercss: "h1::text"
        articlecss: "article.bd-article"

  - name: Troitsky Variant
    topic: "Russian popular science: physics, mathematics, biology, astronomy, history of science, science policy"
    tags: [science, new_technology, AI, other]
    spider:
      user_agent: "Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:147.0) Gecko/20100101 Firefox/147.0"
    output:
      added_file: "added-tr.txt"
      summary_file: "summary-tr.json"
    sites:
      - name: "Troitsky variant"
        url: "https://www.trv-science.ru/feed/"
        css: "rss"
        link: "link"
        headercss: "h1::text"
        articlecss: ".post"
