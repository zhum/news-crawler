spider:
  user_agent: "newsfetcher"
  download_delay: 1
  concurrent_requests_per_domain: 1
  robotstxt_obey: true

logging:
  log_file: "newsfetcher.log"
  log_level: "INFO"

ai:
  model: "llama3.1-8b-long-ctx"
  temperature: 0.01
  max_lines: 300

tags:
  hardware: "CPUs, GPUs, accelerators, storage"
  software: "Tools, libraries, frameworks"
  benchmarks: "Performance results and comparisons"
  AI: "Machine learning, LLMs, inference"
  science: "Scientific research and discoveries"
  other: "Other topics"

groups:
  - name: HPC News
    tags: [hardware, software, benchmarks, AI, other]
    output:
      added_file: "added.txt"
      summary_file: "summary.json"
    sites:
      - name: News website
        url: https://www.newswebsite.com/news/feed
        css: div.card-body
        link: a.article-link::attr(href)
        headercss: .articleHeader::text
        articlecss: .articleBody
      - name: RSS website
        url: https://www.rsswebsite.org/feed
        css: rss
        link: link
        headercss: h1::text
        articlecss: .article-body

  - name: Science
    tags: [science, AI, other]
    output:
      added_file: "added-science.txt"
      summary_file: "summary-science.json"
    sites:
      - name: Science website
        url: https://www.sciencewebsite.org/feed
        css: rss
        link: link
        headercss: h1::text
        articlecss: .post
